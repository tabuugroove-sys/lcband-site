name: Brand SERP check (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-serp-check-manual
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Capture public search pages
        timeout-minutes: 5
        run: node scripts/brand-serp-check.mjs

      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brand-serp-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/brand-serp/
          retention-days: 7
          if-no-files-found: warn
