<style>
html,body{margin:0;background:#090909;color:#fff;height:100%;font:14px system-ui}
body{display:flex;flex-direction:column}
[hidden]{display:none!important}
.stage{position:relative;flex:1;min-height:0;display:flex;background:#000}
.stage>video{width:100%;height:100%;min-width:0;min-height:0;flex:1;object-fit:contain}
body{height:100dvh}
.player-bar,footer{display:flex;align-items:center;gap:8px;padding:4px 12px;flex:none}
.player-bar{border-bottom:1px solid #292929}
.player-bar a,footer .action{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;color:#fff;text-decoration:none}
.player-bar a:focus-visible,footer .action:focus-visible{outline:2px solid #d7b77d;outline-offset:-2px}
#exit{width:44px;flex:none;font-size:28px;line-height:1}
#title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#home{margin-inline-start:auto;flex:none;font-weight:650;gap:4px}
footer{flex-wrap:wrap;border-top:1px solid #292929;padding-bottom:max(4px,env(safe-area-inset-bottom))}
footer .action{border:0;border-radius:8px;background:none;font:inherit;padding:0 10px;cursor:pointer}
.player-bar a:hover,footer .action:hover{background:#282828}
.site-orb{display:block;width:34px;height:34px;flex:none}
@media (prefers-reduced-motion:no-preference){
  .site-orb__map{animation:orb-revolution 9s linear infinite}
  .site-orb__light{animation:orb-reflection 9s ease-in-out infinite}
  @keyframes orb-revolution{to{transform:translateX(-120px)}}
  @keyframes orb-reflection{0%,100%{transform:translate(-2px,1px);opacity:.8}50%{transform:translate(9px,4px);opacity:1}}
}
#share-status{font-size:12px;color:#ccc}
a{color:#eee}
p{padding:16px}
/* previous / next arrows: at the side edges, centred vertically, clear of the native control bar */
.nav{position:absolute;top:50%;z-index:2;width:52px;height:52px;margin:-26px 0 0;padding:0;border:1px solid rgba(255,255,255,.6);border-radius:50%;background:rgba(9,9,9,.68);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;-webkit-tap-highlight-color:transparent}
.nav--prev{inset-inline-start:10px}
.nav--next{inset-inline-end:10px}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .nav svg{transform:scaleX(-1)}
.stage.is-active .nav,.nav:focus-visible{opacity:1;pointer-events:auto}
.nav:hover{background:rgba(9,9,9,.88);border-color:#fff}
.nav:focus-visible,.end button:focus-visible,.tile:focus-visible{outline:2px solid #d7b77d;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.nav{transition:opacity .25s}}
/* end screen: «watch next» */
.end{position:absolute;inset:0;z-index:5;box-sizing:border-box;display:flex;flex-direction:column;overflow:auto;padding:12px 16px 16px;background:rgba(9,9,9,.93)}
.end__box{width:100%;max-width:900px;margin:auto}
.end__top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.end h2{margin:0;font:600 18px/1.3 system-ui;color:#fff}
.end__close{flex:none;width:44px;height:44px;padding:0;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:transparent;color:#fff;font:400 26px/1 system-ui;cursor:pointer}
.end__grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.end__grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:block;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#222;color:#fff;text-decoration:none}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile__play{position:absolute;inset-inline-end:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(9,9,9,.72);border:1px solid rgba(255,255,255,.7)}
.tile__play::before{content:"";position:absolute;top:50%;left:50%;margin:-6px 0 0 -4px;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #fff}
[dir=rtl] .tile__play::before{border-width:6px 10px 6px 0;border-color:transparent #fff transparent transparent;margin-left:-6px}
.tile__cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.6) 55%,rgba(0,0,0,0));font:600 13px/1.25 system-ui;color:#fff;overflow-wrap:anywhere}
.tile:hover .tile__play,.tile:focus-visible .tile__play{background:#fff}
.tile:hover .tile__play::before,.tile:focus-visible .tile__play::before{border-left-color:#111}
.end__again{display:block;min-height:44px;margin:16px auto 0;padding:0 24px;border:0;border-radius:24px;background:#f6f1e8;color:#111;font:600 15px system-ui;cursor:pointer}
.end__again:hover{background:#fff}
@media (max-height:430px){.end{padding:8px 12px 10px}.end__top{margin-bottom:6px}.end h2{font-size:15px}.end__close{width:40px;height:40px}.end__grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile__cap{font-size:11px;padding:14px 6px 5px}.tile__play{display:none}.end__again{margin-top:10px}}
@media (max-height:430px) and (max-width:559px){.end__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>
document.addEventListener('DOMContentLoaded', () => {
  const { lang, copy } = window.LCBLocale;
  const rtl = lang === 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  document.title = copy.video + ' — Luxury Band';
  document.getElementById('download').textContent = copy.download;
  document.getElementById('error').textContent = copy.embedError;
  const home = 'https://luxuryband.ru' + copy.home;
  const exit = document.getElementById('exit');
  document.getElementById('home').href = exit.href = home;
  exit.setAttribute('aria-label', ({ ru: 'Закрыть видео и перейти на главную', en: 'Close video and go to homepage', ar: 'إغلاق الفيديو والانتقال إلى الصفحة الرئيسية', 'pt-BR': 'Fechar vídeo e ir para a página inicial' })[lang] || copy.close);
  const params = new URLSearchParams(location.search);
  const source = params.get('src');
  if (!source) { document.getElementById('error').hidden = false; return; }
  const ORIGIN = 'https://luxuryband.ru';
  // One place that validates a player source and applies the legacy / codec fixes.
  function resolveSource(value) {
    let url;
    try { url = new URL(value, ORIGIN); }
    catch { return null; }
    if (url.origin !== ORIGIN || !/^\/assets\/video\/mp4\/[a-zA-Z0-9_-]+\.mp4$/.test(url.pathname)) return null;
    url.searchParams.delete('download');
    const previousPerfect = url.pathname.match(/\/live-perfect(?:-34be773c40a4)?-(720|1080)\.mp4$/);
    const currentPerfect = window.LCBPromoVideoSources?.['live-perfect'];
    if (previousPerfect && currentPerfect?.family) {
      url.pathname = `/assets/video/mp4/${currentPerfect.family}-${previousPerfect[1]}.mp4`;
    }
    if (!window.LCBVideoQuality.supports(url.href)) url.pathname = url.pathname.replace(/-2160\.mp4$/, '-1080.mp4');
    if (/\/live-icon-(720|1080)\.mp4$/.test(url.pathname)) url.searchParams.set('v', '20261002cut6');
    return url;
  }
  const url = resolveSource(source);
  if (!url) { document.getElementById('error').hidden = false; return; }
  const video = document.querySelector('video');
  video.src = url.href;
  video.addEventListener('error', () => { document.getElementById('error').hidden = false; });
  const genericTitle = 'Luxury Band';
  const title = params.get('title') || genericTitle;
  document.title = title + ' — Luxury Band';
  document.getElementById('title').textContent = title;
  const address = new URL('/download.php', 'https://luxuryband.ru');
  address.searchParams.set('file', url.pathname.split('/').pop());
  if (lang !== 'ru') address.searchParams.set('lang', lang);
  const download = document.getElementById('download');
  download.href = address.href; download.hidden = false;
  const share = document.getElementById('share');
  const status = document.getElementById('share-status');
  share.textContent = copy.share;
  share.hidden = false;
  share.addEventListener('click', async () => {
    const link = new URL('/embed/' + location.search, ORIGIN).href;
    status.textContent = '';
    if (navigator.share) {
      try { await navigator.share({ title: document.getElementById('title').textContent, url: link }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(link); status.textContent = copy.copied; }
    catch { window.prompt(copy.copyLink, link); }
  });
  video.addEventListener('loadstart', () => {
    address.searchParams.set('file', new URL(video.src).pathname.split('/').pop());
    download.href = address.href;
    document.getElementById('error').hidden = !video.error;
  });
  window.LCBVideoQuality.attach(video, document.querySelector('footer'));

  /* ---- playlist: previous / next arrows and the «watch next» end screen ---- */
  const stage = document.getElementById('stage');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const end = document.getElementById('end');
  const grid = document.getElementById('endGrid');
  const again = document.getElementById('again');
  const endClose = document.getElementById('endClose');
  document.getElementById('endTitle').textContent = copy.watchNext;
  again.textContent = copy.watchAgain;
  endClose.setAttribute('aria-label', copy.close);
  prev.setAttribute('aria-label', copy.previousVideo);
  next.setAttribute('aria-label', copy.nextVideo);
  let items = [];
  let current = -1;

  const familyOf = item => window.LCBPromoVideoSources?.[item.slug]?.family || item.slug;
  const titleOf = item => (lang !== 'ru' && item.titleEn) || item.title;
  const posterOf = (item, size) => `/assets/video/posters/${(lang !== 'ru' && item.posterIntl) || item.poster}-${size}.webp`;
  const slowLink = () => { const c = navigator.connection; return Boolean(c && (c.saveData || /(^|-)2g|3g/.test(c.effectiveType || ''))); };
  const sourcePathOf = item => `/assets/video/mp4/${familyOf(item)}-${slowLink() ? 720 : 1080}.mp4`;
  const indexOfPath = pathname => {
    const base = pathname.split('/').pop().replace(/\.mp4$/, '').replace(/-(480|720|1080|2160)$/, '');
    return items.findIndex(item => base === familyOf(item) || base === item.slug || base.replace(/-[0-9a-f]{12}$/, '') === item.slug);
  };
  // Same ?src=/path&title=… shape as the short links; a copied address opens this video.
  function pageQuery(srcValue, titleValue) {
    const query = new URLSearchParams({ src: srcValue, title: titleValue });
    if (lang !== 'ru') query.set('lang', lang);
    return '?' + query.toString().replace(/%2F/gi, '/');
  }
  function setPoster(item) {
    if (!item) { video.removeAttribute('poster'); return; }
    video.poster = posterOf(item, window.innerWidth * (window.devicePixelRatio || 1) > 900 ? 1080 : 720);
  }
  function describeArrows() {
    const n = items.length;
    const target = delta => items[current < 0 ? (delta > 0 ? 0 : n - 1) : (current + delta + n) % n];
    prev.title = titleOf(target(-1));
    next.title = titleOf(target(1));
  }
  function open(index) {
    const item = items[index];
    const resolved = item && resolveSource(sourcePathOf(item));
    if (!resolved) return;
    current = index;
    hideEnd();
    document.getElementById('error').hidden = true;
    setPoster(item);
    video.src = resolved.href;
    document.getElementById('title').textContent = titleOf(item);
    document.title = titleOf(item) + ' — Luxury Band';
    try { history.replaceState(null, '', location.pathname + pageQuery(resolved.pathname + resolved.search, titleOf(item))); } catch {}
    describeArrows();
    // Called inside the tap / key / swipe that asked for it, so mobile browsers allow sound.
    const started = video.play();
    if (started && started.catch) started.catch(() => {});
    wake();
  }
  function go(delta) {
    const n = items.length;
    if (!n) return;
    open(current < 0 ? (delta > 0 ? 0 : n - 1) : (current + delta + n) % n);
  }

  // The arrows follow the native controls: visible on activity, hidden a few seconds into playback.
  let idleTimer;
  function wake() {
    stage.classList.add('is-active');
    clearTimeout(idleTimer);
    if (!video.paused && !video.ended) idleTimer = setTimeout(() => stage.classList.remove('is-active'), 3000);
  }
  ['pointermove', 'pointerdown', 'touchstart', 'keydown', 'focusin'].forEach(name => stage.addEventListener(name, wake, { passive: true }));
  ['play', 'playing', 'pause', 'ended'].forEach(name => video.addEventListener(name, wake));
  wake();

  function endCount() { return window.matchMedia('(max-height:430px)').matches ? 4 : 6; }
  function showEnd() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (video.webkitDisplayingFullscreen) video.webkitExitFullscreen();
    } catch {}
    grid.replaceChildren();
    const limit = endCount();
    for (let step = 0, index = current < 0 ? 0 : current + 1; step < items.length && grid.children.length < limit; step++, index++) {
      const at = index % items.length;
      if (at === current) continue;
      const item = items[at];
      const path = resolveSource(sourcePathOf(item));
      if (!path) continue;
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.className = 'tile';
      link.href = pageQuery(path.pathname + path.search, titleOf(item));
      link.dataset.index = String(at);
      const img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      img.src = posterOf(item, 720);
      const play = document.createElement('span');
      play.className = 'tile__play';
      play.setAttribute('aria-hidden', 'true');
      const caption = document.createElement('span');
      caption.className = 'tile__cap';
      caption.textContent = titleOf(item);
      link.append(img, play, caption);
      li.append(link);
      grid.append(li);
    }
    end.hidden = false;
    again.focus({ preventScroll: true });
  }
  function hideEnd() {
    if (end.hidden) return false;
    end.hidden = true;
    grid.replaceChildren();
    return true;
  }
  video.addEventListener('ended', showEnd);
  video.addEventListener('playing', hideEnd);
  grid.addEventListener('click', event => {
    const link = event.target.closest('a[data-index]');
    if (!link || event.metaKey || event.ctrlKey || event.shiftKey || event.button) return;
    event.preventDefault();
    open(Number(link.dataset.index));
  });
  again.addEventListener('click', () => {
    hideEnd();
    video.currentTime = 0;
    const started = video.play();
    if (started && started.catch) started.catch(() => {});
  });
  endClose.addEventListener('click', () => { hideEnd(); video.focus({ preventScroll: true }); });
  prev.addEventListener('click', () => go(-1));
  next.addEventListener('click', () => go(1));

  // ←/→ switch videos (Shift+←/→ seeks 10 s instead); Esc closes the end screen.
  document.addEventListener('keydown', event => {
    if (event.defaultPrevented || event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key === 'Escape') { if (hideEnd()) { event.preventDefault(); video.focus({ preventScroll: true }); } return; }
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    if (!items.length) return;
    const forward = (event.key === 'ArrowRight') !== rtl;
    event.preventDefault();
    if (event.shiftKey) { if (Number.isFinite(video.duration)) video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (forward ? 10 : -10))); return; }
    go(forward ? 1 : -1);
  });

  // Swipe on the picture (not on the control bar at the bottom): left = next, right = previous.
  let swipe = null;
  stage.addEventListener('touchstart', event => {
    const touch = event.touches[0];
    const box = stage.getBoundingClientRect();
    swipe = event.touches.length === 1 && end.hidden && touch.clientY < box.bottom - 96 ? { x: touch.clientX, y: touch.clientY, time: Date.now() } : null;
  }, { passive: true });
  stage.addEventListener('touchend', event => {
    const start = swipe;
    swipe = null;
    if (!start || !items.length || !end.hidden) return;
    const touch = event.changedTouches[0];
    const dx = touch.clientX - start.x;
    const dy = touch.clientY - start.y;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - start.time > 800) return;
    go((dx < 0) !== rtl ? 1 : -1);
  }, { passive: true });

  // The playlist is a separate small file; without it the page works exactly as a single-video player.
  fetch('/embed/playlist.json', { cache: 'no-cache' }).then(response => response.ok ? response.json() : Promise.reject(new Error('playlist ' + response.status))).then(data => {
    items = (data.items || []).filter(item => item.slug && item.poster && (lang === 'ru' || item.intl));
    if (!items.length) return;
    current = indexOfPath(url.pathname);
    if (current >= 0) {
      setPoster(items[current]);
      if (!params.get('title') || title === genericTitle) {
        document.getElementById('title').textContent = titleOf(items[current]);
        document.title = titleOf(items[current]) + ' — Luxury Band';
      }
    }
    describeArrows();
    prev.hidden = false;
    next.hidden = false;
    wake();
  }).catch(() => {});
});
</script></body></html>
