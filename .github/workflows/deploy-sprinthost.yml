name: Deploy to Sprinthost preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sprinthost-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build preview
        run: PATHPREFIX=/ npx @11ty/eleventy

      - name: Install deploy client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy static files without videos
        env:
          SSHPASS: ${{ secrets.SPRINTHOST_PASSWORD }}
          SPRINTHOST_HOST: ${{ secrets.SPRINTHOST_HOST }}
          SPRINTHOST_USER: ${{ secrets.SPRINTHOST_USER }}
        run: |
          test -n "$SSHPASS"
          test -n "$SPRINTHOST_HOST"
          test -n "$SPRINTHOST_USER"
          cd _site
          tar czf /tmp/lcband-static.tgz --exclude='*.mp4' .
          for remote_dir in \
            '~/domains/a1279060.xsph.ru/public_html' \
            '~/domains/luxuryband.ru/public_html'
          do
            sshpass -e ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "$SPRINTHOST_USER@$SPRINTHOST_HOST" \
              "tar xzf - -C $remote_dir" < /tmp/lcband-static.tgz
          done

      - name: Deploy selected video files
        env:
          SSHPASS: ${{ secrets.SPRINTHOST_PASSWORD }}
          SPRINTHOST_HOST: ${{ secrets.SPRINTHOST_HOST }}
          SPRINTHOST_USER: ${{ secrets.SPRINTHOST_USER }}
        run: |
          test -n "$SSHPASS"
          test -n "$SPRINTHOST_HOST"
          test -n "$SPRINTHOST_USER"
          cd _site
          tar czf /tmp/lcband-videos.tgz \
            assets/video/mp4/live-big-lineup-720.mp4 \
            assets/video/mp4/live-big-lineup-1080.mp4 \
            assets/video/mp4/live-berezy-720.mp4 \
            assets/video/mp4/live-berezy-1080.mp4 \
            assets/video/mp4/live-sax-wedding-welcome-720.mp4 \
            assets/video/mp4/live-sax-wedding-welcome-1080.mp4 \
            assets/video/mp4/interact-laz-coco-jambo-720.mp4 \
            assets/video/mp4/interact-laz-coco-jambo-1080.mp4 \
            assets/video/mp4/live-jazz-vintage-720.mp4 \
            assets/video/mp4/live-jazz-vintage-1080.mp4 \
            assets/video/mp4/live-simple-the-best-720.mp4 \
            assets/video/mp4/live-simple-the-best-1080.mp4 \
            assets/video/mp4/live-adele-hello-720.mp4 \
            assets/video/mp4/live-adele-hello-1080.mp4 \
            assets/video/mp4/promo-cold-heart-720.mp4 \
            assets/video/mp4/promo-cold-heart-1080.mp4 \
            assets/video/mp4/promo-danza-cuduro-720.mp4 \
            assets/video/mp4/promo-danza-cuduro-1080.mp4 \
            assets/video/mp4/promo-danza-cuduro-2160.mp4 \
            assets/video/mp4/luxury-latin-dance-master-class-720.mp4 \
            assets/video/mp4/luxury-latin-dance-master-class-1080.mp4 \
            assets/video/mp4/latin-music-luxury-cover-band-720.mp4 \
            assets/video/mp4/latin-music-luxury-cover-band-1080.mp4 \
            assets/video/mp4/latin-music-luxury-cover-band-2160.mp4 \
            assets/video/mp4/teddy-latina-promo-720.mp4 \
            assets/video/mp4/teddy-latina-promo-1080.mp4 \
            assets/video/mp4/latin-modern-program-720.mp4 \
            assets/video/mp4/latin-modern-program-1080.mp4 \
            assets/video/mp4/teddy-jzhet-720.mp4 \
            assets/video/mp4/teddy-jzhet-1080.mp4
          for remote_dir in \
            '~/domains/a1279060.xsph.ru/public_html' \
            '~/domains/luxuryband.ru/public_html'
          do
            sshpass -e ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "$SPRINTHOST_USER@$SPRINTHOST_HOST" \
              "tar xzf - -C $remote_dir" < /tmp/lcband-videos.tgz
          done
