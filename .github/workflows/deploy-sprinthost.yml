name: Build & Deploy to Sprinthost

on:
  push:
    branches: [main]
    paths-ignore:
      - "media/**"
  workflow_dispatch:

concurrency:
  group: sprinthost-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Verify production media
        run: npm run media:check

      - name: Build production site
        run: npm run preview

      - name: Install deploy client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy site to luxuryband.ru
        env:
          SSHPASS: ${{ secrets.SPRINTHOST_PASSWORD }}
          SPRINTHOST_HOST: ${{ secrets.SPRINTHOST_HOST }}
          SPRINTHOST_USER: ${{ secrets.SPRINTHOST_USER }}
        run: |
          test -n "$SSHPASS"
          test -n "$SPRINTHOST_HOST"
          test -n "$SPRINTHOST_USER"
          cd _site
          tar czf /tmp/lcband-static.tgz .
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SPRINTHOST_USER@$SPRINTHOST_HOST" \
            "tar xzf - -C 'domains/luxuryband.ru/public_html'" < /tmp/lcband-static.tgz
